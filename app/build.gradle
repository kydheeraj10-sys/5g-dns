plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fivednsquick'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.fivednsquick'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}
