
name: Build 5G DNS Quick Switch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check project files
        shell: bash
        run: |
          set -e
          test -f settings.gradle || {
            echo "ERROR: settings.gradle is missing"
            exit 1
          }
          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle is missing"
            exit 1
          }
          test -f gradlew || {
            echo "ERROR: gradlew is missing"
            exit 1
          }
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 5G-DNS-Quick-Switch-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
